<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect width="1000" height="420" fill="#fcfcfb"/>
<text x="40" y="46" font-size="21" font-weight="600" fill="#0b0b0b">The loop</text><text x="40" y="72" font-size="15" fill="#52514e">Everything we call an "inference engine" is orchestration wrapped around this cycle.</text><rect x="40" y="120" width="200" height="96" rx="10" fill="#ffffff" stroke="#e3e2de" stroke-width="1.5"/><text x="140.0" y="157" font-size="16" font-weight="600" text-anchor="middle" fill="#0b0b0b">tokens so far</text><text x="140.0" y="179" font-size="12.5" text-anchor="middle" fill="#52514e">the whole sequence,</text><text x="140.0" y="196" font-size="12.5" text-anchor="middle" fill="#52514e">every time</text><path d="M 248 168.0 L 272 168.0" stroke="#8a8985" stroke-width="2" marker-end="url(#a1)"/><rect x="280" y="120" width="200" height="96" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="2"/><text x="380.0" y="157" font-size="16" font-weight="600" text-anchor="middle" fill="#0b0b0b">forward pass</text><text x="380.0" y="179" font-size="12.5" text-anchor="middle" fill="#52514e">32–80 transformer</text><text x="380.0" y="196" font-size="12.5" text-anchor="middle" fill="#52514e">layers</text><path d="M 488 168.0 L 512 168.0" stroke="#8a8985" stroke-width="2" marker-end="url(#a1)"/><rect x="520" y="120" width="200" height="96" rx="10" fill="#ffffff" stroke="#e3e2de" stroke-width="1.5"/><text x="620.0" y="157" font-size="16" font-weight="600" text-anchor="middle" fill="#0b0b0b">logits</text><text x="620.0" y="179" font-size="12.5" text-anchor="middle" fill="#52514e">one score per token</text><text x="620.0" y="196" font-size="12.5" text-anchor="middle" fill="#52514e">in the vocabulary</text><path d="M 728 168.0 L 752 168.0" stroke="#8a8985" stroke-width="2" marker-end="url(#a1)"/><rect x="760" y="120" width="200" height="96" rx="10" fill="#ffffff" stroke="#e3e2de" stroke-width="1.5"/><text x="860.0" y="157" font-size="16" font-weight="600" text-anchor="middle" fill="#0b0b0b">sample</text><text x="860.0" y="179" font-size="12.5" text-anchor="middle" fill="#52514e">temperature,</text><text x="860.0" y="196" font-size="12.5" text-anchor="middle" fill="#52514e">top-p → one token</text><path d="M 860 216 L 860 300 Q 860 320 840 320 L 160 320 Q 140 320 140 300 L 140 216" fill="none" stroke="#eb6834" stroke-width="3.5" marker-end="url(#a2)"/><rect x="392" y="304" width="216" height="30" rx="6" fill="#fcfcfb"/><text x="500" y="325" font-size="14.5" font-weight="600" text-anchor="middle" fill="#eb6834">append it, and do it all again</text><text x="40" y="378" font-size="13.5" fill="#52514e">No plan. No lookahead. No revision. A 2,000-word essay is 2,000+ passes through this loop,</text><text x="40" y="398" font-size="13.5" fill="#52514e">each one conditioned only on what has already been written.</text><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8985"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"/></marker></defs></svg>