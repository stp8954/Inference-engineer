<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="398" viewBox="0 0 1000 398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect width="1000" height="398" fill="#fcfcfb"/>
<text x="40" y="46" font-size="21" font-weight="600" fill="#0b0b0b">Two peak-rate lower bounds, drawn to scale</text><text x="40" y="72" font-size="15" fill="#52514e">8B dense model, BF16, batch size 1, H100 SXM. This is not a measured timeline.</text><rect x="40" y="120" width="920" height="66" rx="5" fill="#2a78d6"/><rect x="956.9435215946844" y="120" width="3.06" height="66" fill="#eb6834"/><text x="58" y="150" font-size="16" font-weight="600" fill="#ffffff">weight-read lower bound at 3.35 TB/s peak</text><text x="58" y="172" font-size="15" fill="#dbe8f8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">16 GB ÷ 3.35 TB/s  ≈  4,800 µs</text><path d="M 958.4435215946844 192 L 958.4435215946844 224 L 808.4435215946844 224" fill="none" stroke="#eb6834" stroke-width="2"/><circle cx="958.4435215946844" cy="192" r="3" fill="#eb6834"/><text x="800.4435215946844" y="229" font-size="15" font-weight="600" text-anchor="end" fill="#eb6834">dense-compute lower bound: 16 µs</text><text x="800.4435215946844" y="249" font-size="13.5" text-anchor="end" fill="#52514e">16 GFLOPs ÷ 989 TFLOP/s peak</text><rect x="40" y="272" width="920" height="1.5" fill="#e3e2de"/><text x="40" y="312" font-size="19" font-weight="600" fill="#0b0b0b">The peak resource imbalance is roughly 295:1.</text><text x="40" y="340" font-size="15" fill="#52514e">Real kernels overlap compute and memory and achieve neither peak; utilization must be measured.</text><text x="40" y="362" font-size="15" fill="#52514e">The roofline prediction: conventional batch-1 dense decode is bandwidth-bound.</text></svg>