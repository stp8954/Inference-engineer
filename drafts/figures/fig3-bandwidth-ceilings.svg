<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect width="1000" height="510" fill="#fcfcfb"/>
<text x="40" y="46" font-size="21" font-weight="600" fill="#0b0b0b">One formula, four machines</text><text x="40" y="72" font-size="15" fill="#52514e">Idealized weight-bandwidth ceiling for an 8B model at BF16 (16 GB), batch size 1 — advertised bandwidth ÷ weight bytes.</text><text x="40" y="144" font-size="15" font-weight="600" fill="#0b0b0b">MacBook Pro, M5</text><text x="40" y="164" font-size="13" fill="#52514e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">153 GB/s</text><rect x="290" y="126" width="25.7" height="34" rx="4" fill="#2a78d6"/><text x="327.6733524355301" y="150" font-size="16" font-weight="600" fill="#0b0b0b">10 tok/s</text><text x="40" y="212" font-size="15" font-weight="600" fill="#0b0b0b">MacBook Pro, M5 Max</text><text x="40" y="232" font-size="13" fill="#52514e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">614 GB/s</text><rect x="290" y="194" width="102.7" height="34" rx="4" fill="#2a78d6"/><text x="404.69340974212037" y="218" font-size="16" font-weight="600" fill="#0b0b0b">38 tok/s</text><text x="40" y="280" font-size="15" font-weight="600" fill="#0b0b0b">RTX 4090</text><text x="40" y="300" font-size="13" fill="#52514e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~1,008 GB/s</text><rect x="290" y="262" width="168.5" height="34" rx="4" fill="#2a78d6"/><text x="470.4813753581662" y="286" font-size="16" font-weight="600" fill="#0b0b0b">63 tok/s</text><text x="40" y="348" font-size="15" font-weight="600" fill="#0b0b0b">H100 SXM</text><text x="40" y="368" font-size="13" fill="#52514e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3,350 GB/s</text><rect x="290" y="330" width="560.0" height="34" rx="4" fill="#2a78d6"/><text x="862.0" y="354" font-size="16" font-weight="600" fill="#0b0b0b">209 tok/s</text><rect x="40" y="406" width="920" height="1.5" fill="#e3e2de"/><text x="40" y="442" font-size="15" fill="#52514e">These are weights-only peak-rate ceilings, not benchmarks or promised performance.</text><text x="40" y="464" font-size="15" fill="#52514e">Quantization reduces the weight term; kernels, dequantization, KV traffic, and overhead determine</text><text x="40" y="486" font-size="15" fill="#52514e">how much of that theoretical gain appears in a real measurement.</text></svg>