<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<rect width="1000" height="510" fill="#fcfcfb"/>
<text x="40" y="46" font-size="21" font-weight="600" fill="#0b0b0b">One formula, four machines</text><text x="40" y="72" font-size="15" fill="#52514e">Predicted decode ceiling for an 8B model at BF16 (16 GB of weights), batch size 1 — memory bandwidth ÷ weight bytes.</text><text x="40" y="144" font-size="15" font-weight="600" fill="#0b0b0b">MacBook Air, M-series</text><text x="40" y="164" font-size="13" fill="#52514e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~100 GB/s</text><rect x="290" y="126" width="16.8" height="34" rx="4" fill="#2a78d6"/><text x="318.8481375358166" y="150" font-size="16" font-weight="600" fill="#0b0b0b">6 tok/s</text><text x="40" y="212" font-size="15" font-weight="600" fill="#0b0b0b">MacBook Pro, M3 Ultra</text><text x="40" y="232" font-size="13" fill="#52514e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~819 GB/s</text><rect x="290" y="194" width="136.9" height="34" rx="4" fill="#2a78d6"/><text x="438.92454632282715" y="218" font-size="16" font-weight="600" fill="#0b0b0b">51 tok/s</text><text x="40" y="280" font-size="15" font-weight="600" fill="#0b0b0b">RTX 4090</text><text x="40" y="300" font-size="13" fill="#52514e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~1,008 GB/s</text><rect x="290" y="262" width="168.5" height="34" rx="4" fill="#2a78d6"/><text x="470.4813753581662" y="286" font-size="16" font-weight="600" fill="#0b0b0b">63 tok/s</text><text x="40" y="348" font-size="15" font-weight="600" fill="#0b0b0b">H100 SXM</text><text x="40" y="368" font-size="13" fill="#52514e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3,350 GB/s</text><rect x="290" y="330" width="560.0" height="34" rx="4" fill="#2a78d6"/><text x="862.0" y="354" font-size="16" font-weight="600" fill="#0b0b0b">209 tok/s</text><rect x="40" y="406" width="920" height="1.5" fill="#e3e2de"/><text x="40" y="442" font-size="15" fill="#52514e">These are ceilings, not benchmarks — no real engine beats them, and good ones get close.</text><text x="40" y="464" font-size="15" fill="#52514e">Quantize the same model to 4-bit and every number roughly quadruples, because you moved fewer bytes,</text><text x="40" y="486" font-size="15" fill="#52514e">not because you found more compute.</text></svg>